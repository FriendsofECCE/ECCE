# If, foreach and while that mean the same in sh.
setup {
if (-e /etc/hostname) then
  echo present
endif
if (-d $HOME/scratch && ! -f $HOME/scratch/lock) then
  setenv SCR $HOME/scratch
else if ($?TMPDIR) then
  setenv SCR $TMPDIR
else
  setenv SCR /tmp
endif
if ("$mdSystemName" != "" && `echo $runDir | grep "/dtemp"` == "") then
  hostname >! $runDir/hopnode.out
  if ($totalprocs > 1) then
    echo parallel
  endif
endif
if (-e a || -e b && -e c) echo mixed
if (-x $nwchem) cp $nwchem /tmp/nwchem
if (! $?SCRATCH) setenv SCRATCH /tmp
foreach f ($runDir/*.in a "b c" $list `ls`)
  echo $f
  if ($f == a) echo found
end
set i = 0
while ($i < 3)
  echo $i
  set i = 1
end
}

wrapup {
cp x y
if ($status != 0) then
  echo "copy failed"
endif
}
