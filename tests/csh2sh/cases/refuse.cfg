# Left alone and reported.
setup {
alias ll 'ls -l'
switch ($runDir)
case /scratch*:
  echo scratch
  breaksw
default:
  echo other
endsw
@ n = $totalprocs * 2
set files = (a b c)
echo $files[1]
echo $#files
echo $#argv
limit coredumpsize 0
echo $runDir:h
if ($x =~ a*) then
  echo glob
endif
if (-o $f) echo mine
if ($#argv > 0) echo args
goto done
foreach f (a b c)
  echo $f
done:
cat << EOF2
setenv NOT A COMMAND >& hidden
EOF2
foreach g (1 2)
echo unterminated
}
