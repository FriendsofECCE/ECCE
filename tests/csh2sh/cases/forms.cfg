# Where a snippet may sit, and what is not one.
NWChemEnvironment {
PATH /opt/x/bin
LD_LIBRARY_PATH /opt/x/lib
}
PBS {
#PBS -V
# setenv here is only a comment
}
setup { setenv A b }
wrapup: setenv C d
NWChemCommand { if (-e x) echo y }
Gaussian-16Command: setenv GAUSS_SCRDIR /scratch
orca_setup {
setenv ORCA_TMP /tmp
}
nwchem_loophole {
if (-e go) then
  sh go >& log
endif
}
sourceFile: /etc/profile.d/modules.csh
filestoremove: *.tmp
