# The forms gensub itself translates.
NWChem: /opt/codes/nwchem
qmgrPath: /usr/local/bin

PBS {
#PBS -S /bin/sh
#PBS -l nodes=$nodes:ppn=$ppn
}

setup {
setenv MLIB_NUMBER_OF_THREADS 1
setenv OMP_NUM_THREADS "1"
setenv EMPTY
unsetenv DISPLAY
set refund = "refund.out"
set n=4
set here = `pwd`
echo done >& /dev/null
echo done >>& $runDir/log
echo done >&! $runDir/log
make |& tee make.log
echo x >! out.txt
exit (0)
}

wrapup {
cat $refund >> $runDir/$outFile
}

NWChemCommand {
mpirun -np $totalprocs $nwchem $inFile >& $outFile
}
