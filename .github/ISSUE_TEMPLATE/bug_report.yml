name: Bug report
description: Something in ECCE doesn't work, crashes, or gives a wrong result.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please describe what happened and attach the `ecce --bug` archive. No field is required, so send what you have: the more you can tell us, the better.
  - type: textarea
    id: diagnose
    attributes:
      label: Bug report archive
      description: |
        Run `ecce --bug`, reproduce the problem, and close the Organizer. It writes `~/ecce-bug-<time>.zip` with the logs, service logs and `ecce-diagnose` output; drag it into this box. It contains no passwords, but it does contain host names, user names and paths, so look through it first.
        If ECCE won't start at all, attach the output of `ecce-diagnose` instead (`ecce-diagnose /path/to/run/dir` for one job).
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the exact text of any error message.
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Which code (NWChem, Gaussian 16, ORCA, ...), which runtype, and what you clicked.
      placeholder: |
        1. New ORCA calculation on water
        2. Theory Details: B3LYP, Runtype: Vibration
        3. Launch
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: ECCE version
      description: "`ecce --version` (the `ecce --bug` archive has it too)."
      placeholder: ECCE 8.16.7
    validations:
      required: false
  - type: input
    id: system
    attributes:
      label: Operating system
      placeholder: Debian 13, Ubuntu 24.04, Rocky 9, WSL2 ...
    validations:
      required: false
  - type: dropdown
    id: mode
    attributes:
      label: How is ECCE set up?
      options:
        - Everything on my machine (plain `ecce`)
        - Client of a central server (`ecce -remote`)
        - Shared broker on an app server (siteconfig/SharedBroker)
        - Not sure
    validations:
      required: false
