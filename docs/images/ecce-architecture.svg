<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Helvetica, Arial, sans-serif">
  <title>ECCE on its own, or with an ECCE server, and the compute machine</title>
  <desc>Two ways to run ECCE. On its own: the ECCE client with a projects folder on your disk and a private broker, no ECCE server. With an ECCE server: one or more clients and an ECCE server (data server and broker), on one computer by default or central for a group. In both, the client submits jobs to a compute machine over ssh.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44546a"/>
    </marker>
  </defs>
  <rect width="960" height="600" rx="14" fill="#ffffff"/>

  <!-- A: on its own -->
  <rect x="20" y="20" width="450" height="340" rx="12" fill="#f5f6f8" stroke="#9aa5b1"/>
  <text x="40" y="50" font-size="19" font-weight="bold" fill="#222">A. On its own</text>
  <text x="40" y="72" font-size="13" fill="#666">One person, one computer. No ECCE server.</text>

  <rect x="40" y="90" width="410" height="110" rx="10" fill="#e8f1fb" stroke="#3b6ea8" stroke-width="2"/>
  <text x="245" y="118" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f3f66">ECCE client</text>
  <text x="245" y="140" text-anchor="middle" font-size="13" fill="#333">Organizer · Builder · Calculation Editor · Viewer</text>
  <text x="245" y="160" text-anchor="middle" font-size="13" fill="#333">Launcher · job storage</text>
  <text x="245" y="186" text-anchor="middle" font-size="12" fill="#1f3f66">package: ecce-client</text>

  <rect x="40" y="236" width="196" height="84" rx="8" fill="#ffffff" stroke="#44546a" stroke-width="1.5"/>
  <text x="138" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Projects folder</text>
  <text x="138" y="282" text-anchor="middle" font-size="12" fill="#333">on your disk</text>
  <text x="138" y="302" text-anchor="middle" font-size="12" fill="#666">Preferences &gt; Data folder</text>
  <rect x="254" y="236" width="196" height="84" rx="8" fill="#ffffff" stroke="#44546a" stroke-width="1.5"/>
  <text x="352" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Private broker</text>
  <text x="352" y="282" text-anchor="middle" font-size="12" fill="#333">started for you, per user</text>
  <text x="352" y="302" text-anchor="middle" font-size="12" fill="#666">package: mosquitto</text>
  <line x1="138" y1="200" x2="138" y2="236" stroke="#44546a" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="352" y1="200" x2="352" y2="236" stroke="#44546a" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="245" y="346" text-anchor="middle" font-size="12" fill="#333">Optional: switched on in Preferences, not the default.</text>

  <!-- B: with a server -->
  <rect x="490" y="20" width="450" height="340" rx="12" fill="#f5f6f8" stroke="#9aa5b1"/>
  <text x="510" y="50" font-size="19" font-weight="bold" fill="#222">B. With an ECCE server</text>
  <text x="510" y="72" font-size="13" fill="#666">The default install; or one server for a group or class.</text>

  <rect x="510" y="90" width="410" height="110" rx="10" fill="#e8f1fb" stroke="#3b6ea8" stroke-width="2"/>
  <text x="715" y="118" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f3f66">ECCE client (one or many)</text>
  <text x="715" y="140" text-anchor="middle" font-size="13" fill="#333">the same windows as in A</text>
  <text x="715" y="186" text-anchor="middle" font-size="12" fill="#1f3f66">package: ecce-client</text>

  <rect x="510" y="236" width="410" height="84" rx="10" fill="#eaf6ec" stroke="#3f8a4f" stroke-width="2"/>
  <text x="715" y="262" text-anchor="middle" font-size="17" font-weight="bold" fill="#24552f">ECCE server</text>
  <text x="715" y="282" text-anchor="middle" font-size="13" fill="#333">data server (projects and results) + broker</text>
  <text x="715" y="304" text-anchor="middle" font-size="12" fill="#24552f">package: ecce-server</text>
  <line x1="715" y1="200" x2="715" y2="236" stroke="#44546a" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="725" y="223" font-size="12" fill="#666">http / MQTT</text>
  <text x="715" y="346" text-anchor="middle" font-size="12" fill="#333">Default: client and server on one computer. Central server: ecce -remote.</text>

  <!-- compute -->
  <line x1="245" y1="360" x2="245" y2="436" stroke="#44546a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="715" y1="360" x2="715" y2="436" stroke="#44546a" stroke-width="2" marker-end="url(#a)"/>
  <text x="257" y="402" font-size="12" fill="#333">ssh: submit and follow jobs</text>
  <text x="727" y="402" font-size="12" fill="#333">ssh: submit and follow jobs</text>

  <rect x="20" y="436" width="920" height="134" rx="12" fill="#fdf1e4" stroke="#b86f1f" stroke-width="2"/>
  <text x="480" y="466" text-anchor="middle" font-size="19" font-weight="bold" fill="#6e4010">Compute machine</text>
  <text x="480" y="488" text-anchor="middle" font-size="13" fill="#6e4010">a workstation or an HPC cluster; the same in A and B</text>
  <rect x="60" y="504" width="250" height="44" rx="8" fill="#ffffff" stroke="#b86f1f"/>
  <text x="185" y="531" text-anchor="middle" font-size="13" fill="#333">Queue system or direct run</text>
  <rect x="355" y="504" width="250" height="44" rx="8" fill="#ffffff" stroke="#b86f1f"/>
  <text x="480" y="531" text-anchor="middle" font-size="13" fill="#333">ECCE job monitor</text>
  <rect x="650" y="504" width="250" height="44" rx="8" fill="#ffffff" stroke="#b86f1f"/>
  <text x="775" y="531" text-anchor="middle" font-size="13" fill="#333">NWChem, ORCA, Gaussian, ...</text>
</svg>
