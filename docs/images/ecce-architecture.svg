<svg xmlns="http://www.w3.org/2000/svg" width="960" height="662" viewBox="0 0 960 662" font-family="Helvetica, Arial, sans-serif">
  <title>Two ways to run ECCE</title>
  <desc>Two rows. With an ECCE server: the client (windows and job agent) saves to and loads from an ECCE server (data server and message broker), on one computer by default or a central server for a lab or class, and submits jobs over ssh to the compute machine. On its own: the client keeps its data in a local folder with its own broker, there is no ECCE server, and it submits jobs over ssh to the compute machine.</desc>
  <rect width="960" height="662" rx="14" fill="#ffffff"/>
  <text x="15" y="32" font-size="22" font-weight="bold" fill="#222">Two ways to run ECCE</text>

  <text x="15" y="66" font-size="18" font-weight="bold" fill="#222">With an ECCE server</text>
  <text x="215" y="66" font-size="13" fill="#777">the default; one computer, or a central server for a lab or class</text>
  <rect x="15" y="80" width="225" height="200" rx="12" fill="#e8f0fb" stroke="#3a6ea5" stroke-width="2"/>
  <text x="127.5" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f3f66">Client</text>
  <text x="127.5" y="121" text-anchor="middle" font-size="11" fill="#777">package: ecce-client</text>
  <rect x="27" y="132" width="201" height="76" rx="8" fill="#ffffff" stroke="#3a6ea5"/>
  <text x="127.5" y="152" text-anchor="middle" font-size="13" fill="#333">Organizer, Builder, Editor,</text>
  <text x="127.5" y="167" text-anchor="middle" font-size="13" fill="#333">Launcher, Viewer</text>
  <rect x="27" y="218" width="201" height="50" rx="8" fill="#fff3dc" stroke="#c8901e" stroke-width="2"/>
  <text x="127.5" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b4a00">Job agent</text>
  <text x="127.5" y="256" text-anchor="middle" font-size="12" fill="#333">submits, follows, stores results</text>
  <rect x="368" y="80" width="225" height="200" rx="12" fill="#eaf5ea" stroke="#3a8a4a" stroke-width="2"/>
  <text x="480.5" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#24552f">ECCE server</text>
  <text x="480.5" y="121" text-anchor="middle" font-size="11" fill="#777">package: ecce-server</text>
  <rect x="380" y="132" width="201" height="76" rx="8" fill="#ffffff" stroke="#3a8a4a"/>
  <text x="480.5" y="152" text-anchor="middle" font-size="13" fill="#333">data server: projects,</text>
  <text x="480.5" y="167" text-anchor="middle" font-size="13" fill="#333">calculations, results</text>
  <text x="480.5" y="182" text-anchor="middle" font-size="13" fill="#333">message broker</text>
  <rect x="720" y="80" width="225" height="200" rx="12" fill="#f3eef9" stroke="#6a4c9c" stroke-width="2"/>
  <text x="832.5" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b2a6b">Compute machine</text>
  <rect x="732" y="132" width="201" height="136" rx="8" fill="#ffffff" stroke="#6a4c9c"/>
  <text x="832.5" y="152" text-anchor="middle" font-size="13" fill="#333">queue system, chemistry code</text>
  <text x="832.5" y="182" text-anchor="middle" font-size="13" fill="#333">ECCE's job monitor</text>
  <text x="832.5" y="197" text-anchor="middle" font-size="13" fill="#333">runs beside the job</text>
  <line x1="243" y1="160" x2="360" y2="160" stroke="#555" stroke-width="2"/>
  <polygon points="366,160 354,154 354,166" fill="#555"/>
  <text x="304.0" y="150" text-anchor="middle" font-size="12" fill="#555">save / load</text>
  <path d="M127.5,280 V300 H832.5 V288" fill="none" stroke="#8a5a00" stroke-width="2"/>
  <polygon points="832.5,282 826.5,294 838.5,294" fill="#8a5a00"/>
  <text x="480" y="316" text-anchor="middle" font-size="12" fill="#8a5a00">ssh: submit, progress, results</text>
  <text x="480" y="336" text-anchor="middle" font-size="12" font-style="italic" fill="#555">The default install runs client and server on one computer; a central server holds everyone's work and clients start ecce -remote.</text>
  <text x="15" y="378" font-size="18" font-weight="bold" fill="#222">On its own</text>
  <text x="125" y="378" font-size="13" fill="#777">optional: Edit &gt; Preferences &gt; Data folder</text>
  <rect x="15" y="392" width="225" height="200" rx="12" fill="#e8f0fb" stroke="#3a6ea5" stroke-width="2"/>
  <text x="127.5" y="417" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f3f66">Client</text>
  <text x="127.5" y="433" text-anchor="middle" font-size="11" fill="#777">package: ecce-client</text>
  <rect x="27" y="444" width="201" height="76" rx="8" fill="#ffffff" stroke="#3a6ea5"/>
  <text x="127.5" y="464" text-anchor="middle" font-size="13" fill="#333">Organizer, Builder, Editor,</text>
  <text x="127.5" y="479" text-anchor="middle" font-size="13" fill="#333">Launcher, Viewer</text>
  <text x="127.5" y="494" text-anchor="middle" font-size="13" fill="#333">data in a local folder</text>
  <text x="127.5" y="509" text-anchor="middle" font-size="13" fill="#333">own broker (mosquitto)</text>
  <rect x="27" y="530" width="201" height="50" rx="8" fill="#fff3dc" stroke="#c8901e" stroke-width="2"/>
  <text x="127.5" y="551" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b4a00">Job agent</text>
  <text x="127.5" y="568" text-anchor="middle" font-size="12" fill="#333">submits, follows, stores results</text>
  <rect x="368" y="392" width="225" height="200" rx="12" fill="#f5f5f5" stroke="#bbb" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="480.5" y="417" text-anchor="middle" font-size="16" font-weight="bold" fill="#999">No ECCE server</text>
  <text x="480.5" y="497" text-anchor="middle" font-size="13" fill="#999">nothing to install or start</text>
  <rect x="720" y="392" width="225" height="200" rx="12" fill="#f3eef9" stroke="#6a4c9c" stroke-width="2"/>
  <text x="832.5" y="417" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b2a6b">Compute machine</text>
  <rect x="732" y="444" width="201" height="136" rx="8" fill="#ffffff" stroke="#6a4c9c"/>
  <text x="832.5" y="464" text-anchor="middle" font-size="13" fill="#333">queue system, chemistry code</text>
  <text x="832.5" y="494" text-anchor="middle" font-size="13" fill="#333">ECCE's job monitor</text>
  <text x="832.5" y="509" text-anchor="middle" font-size="13" fill="#333">runs beside the job</text>
  <path d="M127.5,592 V612 H832.5 V600" fill="none" stroke="#8a5a00" stroke-width="2"/>
  <polygon points="832.5,594 826.5,606 838.5,606" fill="#8a5a00"/>
  <text x="480" y="628" text-anchor="middle" font-size="12" fill="#8a5a00">ssh: submit, progress, results</text>
  <text x="480" y="648" text-anchor="middle" font-size="12" font-style="italic" fill="#555">One user, one computer; no data server. To become the default once native macOS and Windows clients build.</text>
</svg>
