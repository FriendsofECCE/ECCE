<svg xmlns="http://www.w3.org/2000/svg" width="960" height="638" viewBox="0 0 960 638" font-family="Helvetica, Arial, sans-serif">
  <title>How ECCE is organised: client, ECCE server and compute machine</title>
  <rect width="960" height="638" fill="#ffffff"/>

  <!-- Client -->
  <rect x="20" y="40" width="270" height="330" rx="12" fill="#e8f1fb" stroke="#3b6ea8" stroke-width="2"/>
  <text x="155" y="68" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f3f66">Client</text>
  <text x="155" y="90" text-anchor="middle" font-size="13" fill="#1f3f66">your computer, or a remote desktop</text>
  <rect x="42" y="108" width="226" height="118" rx="8" fill="#ffffff" stroke="#3b6ea8"/>
  <text x="155" y="131" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f3f66">The ECCE windows</text>
  <text x="155" y="153" text-anchor="middle" font-size="13" fill="#333">Organizer · Builder</text>
  <text x="155" y="173" text-anchor="middle" font-size="13" fill="#333">Calculation Editor · Launcher</text>
  <text x="155" y="193" text-anchor="middle" font-size="13" fill="#333">Viewer · Basis Set Tool</text>
  <text x="155" y="213" text-anchor="middle" font-size="12" fill="#666">(what you see and click)</text>
  <rect x="42" y="240" width="226" height="108" rx="8" fill="#ffffff" stroke="#3b6ea8"/>
  <text x="155" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f3f66">Behind the windows</text>
  <text x="155" y="285" text-anchor="middle" font-size="13" fill="#333">writes the input files</text>
  <text x="155" y="305" text-anchor="middle" font-size="13" fill="#333">submits and follows jobs</text>
  <text x="155" y="325" text-anchor="middle" font-size="13" fill="#333">reads the results back</text>

  <!-- ECCE server -->
  <rect x="345" y="40" width="270" height="330" rx="12" fill="#eaf6ec" stroke="#3f8a4f" stroke-width="2"/>
  <text x="480" y="68" text-anchor="middle" font-size="19" font-weight="bold" fill="#24552f">ECCE server</text>
  <text x="480" y="90" text-anchor="middle" font-size="13" fill="#24552f">not where calculations run</text>
  <rect x="367" y="108" width="226" height="118" rx="8" fill="#ffffff" stroke="#3f8a4f"/>
  <text x="480" y="131" text-anchor="middle" font-size="14" font-weight="bold" fill="#24552f">Data server</text>
  <text x="480" y="153" text-anchor="middle" font-size="13" fill="#333">stores projects, structures,</text>
  <text x="480" y="173" text-anchor="middle" font-size="13" fill="#333">calculations and results</text>
  <text x="480" y="193" text-anchor="middle" font-size="13" fill="#333">plus the basis-set library</text>
  <text x="480" y="213" text-anchor="middle" font-size="12" fill="#666">(Apache, WebDAV)</text>
  <rect x="367" y="240" width="226" height="108" rx="8" fill="#ffffff" stroke="#3f8a4f"/>
  <text x="480" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#24552f">Message broker</text>
  <text x="480" y="285" text-anchor="middle" font-size="13" fill="#333">lets the ECCE windows</text>
  <text x="480" y="305" text-anchor="middle" font-size="13" fill="#333">tell each other what changed</text>
  <text x="480" y="325" text-anchor="middle" font-size="12" fill="#666">(ActiveMQ)</text>

  <!-- Compute machine -->
  <rect x="670" y="40" width="270" height="330" rx="12" fill="#fdf1e4" stroke="#b86f1f" stroke-width="2"/>
  <text x="805" y="68" text-anchor="middle" font-size="19" font-weight="bold" fill="#6e4010">Compute machine</text>
  <text x="805" y="90" text-anchor="middle" font-size="13" fill="#6e4010">a workstation or an HPC cluster</text>
  <rect x="692" y="108" width="226" height="118" rx="8" fill="#ffffff" stroke="#b86f1f"/>
  <text x="805" y="131" text-anchor="middle" font-size="14" font-weight="bold" fill="#6e4010">Login node</text>
  <text x="805" y="153" text-anchor="middle" font-size="13" fill="#333">queue system</text>
  <text x="805" y="173" text-anchor="middle" font-size="13" fill="#333">(Slurm, PBS, … or none)</text>
  <text x="805" y="193" text-anchor="middle" font-size="13" fill="#333">ECCE's job monitor</text>
  <text x="805" y="213" text-anchor="middle" font-size="12" fill="#666">(watches the output as it grows)</text>
  <rect x="692" y="240" width="226" height="108" rx="8" fill="#ffffff" stroke="#b86f1f"/>
  <text x="805" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#6e4010">Compute nodes</text>
  <text x="805" y="285" text-anchor="middle" font-size="13" fill="#333">run the chemistry code:</text>
  <text x="805" y="305" text-anchor="middle" font-size="13" fill="#333">NWChem, ORCA, Gaussian,</text>
  <text x="805" y="325" text-anchor="middle" font-size="13" fill="#333">MOPAC, …</text>

  <!-- arrows client <-> server -->
  <line x1="300" y1="160" x2="358" y2="160" stroke="#44546a" stroke-width="2.5"/>
  <polygon points="292,160 301,155 301,165" fill="#44546a"/>
  <polygon points="366,160 357,155 357,165" fill="#44546a"/>
  <text x="329" y="148" text-anchor="middle" font-size="11" fill="#44546a">save</text>
  <text x="329" y="178" text-anchor="middle" font-size="11" fill="#44546a">load</text>
  <line x1="300" y1="294" x2="358" y2="294" stroke="#44546a" stroke-width="2.5"/>
  <polygon points="292,294 301,289 301,299" fill="#44546a"/>
  <polygon points="366,294 357,289 357,299" fill="#44546a"/>
  <text x="329" y="284" text-anchor="middle" font-size="11" fill="#44546a">notify</text>

  <!-- client <-> compute over ssh, routed below the server -->
  <line x1="155" y1="382" x2="155" y2="430" stroke="#44546a" stroke-width="2.5"/>
  <line x1="155" y1="430" x2="805" y2="430" stroke="#44546a" stroke-width="2.5"/>
  <line x1="805" y1="430" x2="805" y2="382" stroke="#44546a" stroke-width="2.5"/>
  <polygon points="155,373 150,382 160,382" fill="#44546a"/>
  <polygon points="805,373 800,382 810,382" fill="#44546a"/>
  <text x="480" y="452" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">The client submits the job to the compute machine over ssh</text>
  <text x="480" y="470" text-anchor="middle" font-size="13" fill="#222">and gets progress and results back the same way; it stores them on the ECCE server.</text>
  <text x="230" y="424" font-size="11" fill="#44546a">submit →</text>
  <text x="690" y="424" font-size="11" fill="#44546a">← results</text>

  <!-- modes -->
  <text x="20" y="508" font-size="16" font-weight="bold" fill="#222">Where the three roles live</text>
  <rect x="20" y="522" width="445" height="96" rx="10" fill="#f5f6f8" stroke="#9aa5b1"/>
  <text x="40" y="548" font-size="14" font-weight="bold" fill="#222">One computer (the default)</text>
  <text x="40" y="570" font-size="13" fill="#333">Client and ECCE server run on your computer. Jobs run</text>
  <text x="40" y="589" font-size="13" fill="#333">there too, or on a cluster you have registered.</text>
  <text x="40" y="608" font-size="12" fill="#666">Install the ecce package and start ecce.</text>
  <rect x="495" y="522" width="445" height="96" rx="10" fill="#f5f6f8" stroke="#9aa5b1"/>
  <text x="515" y="548" font-size="14" font-weight="bold" fill="#222">Central server (a lab or class)</text>
  <text x="515" y="570" font-size="13" fill="#333">One ECCE server holds everyone's work; each user runs</text>
  <text x="515" y="589" font-size="13" fill="#333">the client and connects to it. Jobs go to the clusters.</text>
  <text x="515" y="608" font-size="12" fill="#666">Clients start ecce -remote; see Setting up a central ECCE server.</text>
</svg>
